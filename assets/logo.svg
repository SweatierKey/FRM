<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">FRM - Fronten Runtime Manager</title>
  <desc id="desc">A terminal prompt flowing into a three-layer runtime stack beside the FRM wordmark.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="940" height="260" rx="40" fill="#0b1020"/>

  <g transform="translate(65 58)" filter="url(#shadow)">
    <rect x="0" y="0" width="190" height="164" rx="28" fill="#111827" stroke="url(#g)" stroke-width="5"/>

    <g fill="none" stroke="url(#g)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M36 45l20 17-20 17"/>
      <path d="M69 79h34"/>
      <rect x="32" y="105" width="126" height="16" rx="8"/>
      <rect x="32" y="130" width="126" height="16" rx="8"/>
    </g>

    <g fill="#22d3ee">
      <circle cx="140" cy="113" r="4"/>
      <circle cx="140" cy="138" r="4"/>
    </g>
  </g>

  <g transform="translate(302 52)">
    <text x="0" y="105" fill="url(#g)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="116" font-weight="800" letter-spacing="4">FRM</text>
    <text x="4" y="154" fill="#d1d5db" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="600" letter-spacing="2.2">FRONTEN RUNTIME MANAGER</text>
    <text x="5" y="196" fill="#718096" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18">discover · inspect · control · verify</text>
  </g>
</svg>
