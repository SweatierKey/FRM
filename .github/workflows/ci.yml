name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash version
        run: bash --version
      - name: Syntax, unit and integration tests
        run: make test
      - name: Bash 4.2 compatibility mode
        run: make compat
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck
        run: make lint
