name: Apply verified lint hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/frm-lint.patch'
      - '.github/workflows/apply-lint-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified runtime patch
        run: |
          git apply --check .github/frm-lint.patch
          git apply .github/frm-lint.patch
          test "$(git hash-object lib/00-core.sh)" = "b129c47b1a7b8363771995051abdd3f51fcdbd3c"
          test "$(git hash-object lib/50-cli.sh)" = "69ff7bd6c9d0e15785a4c94e569776537843b799"

      - name: Functional regression suite
        run: |
          make test
          make compat

      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          make lint

      - name: Commit verified hardening and remove bootstrap
        run: |
          rm -f .github/frm-lint.patch .github/workflows/apply-lint-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Harden ShellCheck lint'
          git push
