name: Apply verified FRM 0.1.4 release

on:
  push:
    branches: [release-0.1.4]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and apply verified patch
        shell: bash
        run: |
          gzip -dc .frm-release/patch.gz > /tmp/frm-0.1.4.patch
          echo '5c3f11c1e2cbc4df6789fe5e839e5c75dddd0eea1cc588efe118dea9cd6d5447  /tmp/frm-0.1.4.patch' | sha256sum -c -
          git apply --check /tmp/frm-0.1.4.patch
          git apply /tmp/frm-0.1.4.patch
          [[ "$(tr -d '[:space:]' < VERSION)" == "0.1.4" ]]
          git diff --check
      - name: Functional regression suite
        shell: bash
        run: |
          make test
          BASH_COMPAT=4.2 ./tests/test.sh
      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: ShellCheck
        run: make lint
      - name: Commit verified 0.1.4 release
        shell: bash
        run: |
          rm -rf .frm-release .github/workflows/release-0.1.4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release FRM 0.1.4'
          git push origin HEAD:release-0.1.4
          git push origin HEAD:main
