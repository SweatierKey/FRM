name: Apply verified FRM 0.1.1 release

on:
  push:
    branches: [main]
    paths:
      - '.frm-maint/**'
      - '.github/workflows/release-0.1.1.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and apply verified patch
        shell: bash
        run: |
          cat .frm-maint/chunk.* > /tmp/frm-0.1.1.patch
          echo '989ea2dd65d0aa31f10e1005d1f03e1ac3b5a66a38460a2894b7f1cc27311387  /tmp/frm-0.1.1.patch' | sha256sum -c -
          git apply --check /tmp/frm-0.1.1.patch
          git apply /tmp/frm-0.1.1.patch
          git diff --check

      - name: Verify patched source hashes
        shell: bash
        run: |
          cat <<'EOF_HASHES' | sha256sum -c -
          80447316529fc62014fbaa047fb67c51ac30e32830cda370405349d8d66d196c  VERSION
          03def61b54588571f56792135b35b3f3468b23a18fc96235b01f9c196d70df46  CHANGELOG.md
          6ebefed09defcff0aa9543b5ab892197bb17ddab8c067a1f14ba3cd41eb9f5b4  README.md
          89fbca7861e9936a49904597d7ee8d2784b14f77649d1f4b5e3d992f2d861d6f  completions/frm.bash
          4977a22ee16e970d2e7c130a55fbfd41a6262769cec713acec17ca811cda871c  demo/frm-demo.cast
          e4ed544e2e0576430b628c8d480ea340db3bbafe2d388712f3124e6c2bf56193  demo/make-demo-cast.py
          2a74f13a58b371585588900d57ae4f7de8471605b657a4b25f9922ae913acdee  lib/00-core.sh
          4a7e5921d00a4cab07f8d2ddc7c2c6e5c426f9609a71dd804b5d1f6d36e35730  lib/10-status.sh
          8994fbad99a090f267d0d7d7e2181764e6264b4a8768f17a9dee4381f987b8ed  lib/30-inspection.sh
          f7501838cd17ddbda59a1f6d2ebbf6d4db42e95dcc261a26eb725aeb1a9a2186  lib/40-help-core.sh
          cb5a4a01befeac1b3cea5fb5db0c1248304ffbdc5fd8da9260888f77d25276e8  lib/50-cli.sh
          96a51857193e5649f33a97853224f6bb98daca115c7d50698b19142a0a9609cc  tests/status.sh
          EOF_HASHES

      - name: Render deterministic README demo
        shell: bash
        run: |
          python3 -m pip install pillow
          python3 demo/render_cast.py demo/frm-demo.cast assets/demo.gif
          echo 'fc5071bd4529c502ed6309e8bc0c3a9fca5490f80c1a4c030f2ef140de525120  assets/demo.gif' | sha256sum -c -

      - name: Functional regression suite
        shell: bash
        run: |
          make test
          make compat

      - name: ShellCheck
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          make lint

      - name: Commit verified 0.1.1 release and remove bootstrap
        shell: bash
        run: |
          git rm -r .frm-maint .github/workflows/release-0.1.1.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Release FRM 0.1.1'
          git push
