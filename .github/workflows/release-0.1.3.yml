name: Apply verified FRM 0.1.3 release

on:
  push:
    branches: [release-0.1.3]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc .frm-release/patch.gz > /tmp/frm-0.1.3.patch
          echo '8e644bc81f71eec5b52df220e4bb076f2571f9065ecf8c222ff44ebaa5143043  /tmp/frm-0.1.3.patch' | sha256sum -c -
          git apply --check /tmp/frm-0.1.3.patch
          git apply /tmp/frm-0.1.3.patch

      - name: Install demo dependency
        run: python3 -m pip install pillow

      - name: Render deterministic README demo
        run: python3 demo/render_cast.py demo/frm-demo.cast assets/demo.gif

      - name: Functional regression suite
        shell: bash
        run: |
          set -euo pipefail
          make test
          make compat

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: ShellCheck
        run: make lint

      - name: Commit verified 0.1.3 release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .frm-release .github/workflows/release-0.1.3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release FRM 0.1.3'
          git push origin HEAD:release-0.1.3 HEAD:main
