name: Maintainer source snapshot
on:
  push:
    branches: [maintenance/source-snapshot]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: df00e11fa7d0872d1b4afdaf81ea77f39351363d
          fetch-depth: 0
      - name: Export exact development source
        run: |
          mkdir -p export
          git archive --format=tar.gz HEAD > export/frm-next-source.tar.gz
          git bundle create export/frm-next.bundle --all
          cp /usr/bin/shellcheck export/shellcheck
          (cd export && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: frm-maintainer-source
          path: export/
          retention-days: 3
