name: Render README demo

on:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/demo.gif'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python3 -m pip install pillow
      - name: Render deterministic GIF
        run: python3 demo/render_cast.py demo/frm-demo.cast assets/demo.gif
      - name: Commit GIF when changed
        run: |
          if [[ -n "$(git status --porcelain -- assets/demo.gif)" ]]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add assets/demo.gif
            git commit -m 'Render README demo [skip ci]'
            git push
          fi
